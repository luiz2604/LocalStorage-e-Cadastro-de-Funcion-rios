
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <h1>Cadastro de Funcionários</h1>

        <h2>Cadastrar Funcionário</h2>

        <form id="formFuncionario">

            <input type="text" id="nome" placeholder="Nome completo" required>

            <input type="email" id="email" placeholder="E-mail" required>

            <input type="text" id="cargo" placeholder="Cargo" required>

            <input type="text" id="departamento" placeholder="Departamento" required>

            <input type="password" id="senha" placeholder="Senha" required>

            <button type="submit">Cadastrar Funcionário</button>

        </form>

        <h2>Funcionários Cadastrados</h2>

        <p>Total de funcionários: <span id="quantidade">0</span></p>

        <div id="listaFuncionarios" class="lista"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
